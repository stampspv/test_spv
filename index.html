<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AR 3D Model Viewer</title>
    <link rel="stylesheet" href="style.css">

    <!-- Model Viewer - Works on ALL devices (iOS + Android) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
</head>
<body>
    <div id="info">
        <h1>Universal AR 3D Model Viewer</h1>
        <p class="subtitle">Works on iOS, Android, and Desktop!</p>

        <div id="device-info">
            <p id="device-status">Loading...</p>
        </div>

        <div id="instructions">
            <h3>Controls:</h3>
            <ul>
                <li><strong>3D View:</strong> Drag to rotate, pinch to zoom</li>
                <li><strong>AR Mode:</strong> Tap "View in AR" button below model</li>
                <li><strong>In AR:</strong> Move, scale, and rotate with gestures</li>
            </ul>
        </div>

        <div id="model-selector">
            <label for="modelSelect">Choose 3D Model:</label>
            <select id="modelSelect">
                <option value="default">Astronaut (Default)</option>
                <option value="robot">Robot</option>
                <option value="custom">Upload .glb/.gltf file</option>
            </select>
            <input type="file" id="fileInput" accept=".glb,.gltf" style="display:none;">
        </div>

        <div id="ar-status"></div>
    </div>

    <!-- Model Viewer Container -->
    <div id="viewer-container">
        <model-viewer
            id="model-viewer"
            src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
            ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
            alt="3D Model"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls
            touch-action="pan-y"
            auto-rotate
            shadow-intensity="1"
            camera-orbit="45deg 55deg 2.5m"
            min-camera-orbit="auto auto 0.5m"
            max-camera-orbit="auto auto 10m"
            loading="eager"
        >
            <!-- AR Button -->
            <button slot="ar-button" id="ar-button">
                View in AR
            </button>

            <!-- Loading indicator -->
            <div id="lazy-load-poster" slot="poster">
                <div class="loader"></div>
                <p>Loading 3D Model...</p>
            </div>

            <!-- Error message -->
            <div id="error-message" slot="error">
                <p>Failed to load 3D model</p>
            </div>
        </model-viewer>

        <button id="close-viewer">Back to Menu</button>
    </div>

    <!-- Main application -->
    <script src="app.js"></script>
</body>
</html>
